<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A local-first MCAT prep platform with legal content ingestion and original question generation workflows.">
    <title>MCAT Forge</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <header class="topbar">
      <div class="brand" aria-label="MCAT Forge home">
        <span class="brand-mark" aria-hidden="true">M</span>
        <div>
          <strong>MCAT Forge</strong>
          <span>Local-first prep platform</span>
        </div>
      </div>
      <nav class="topnav" aria-label="Primary navigation">
        <a href="#/dashboard">Dashboard</a>
        <a href="#/learn">Learn</a>
        <a href="#/practice">Practice</a>
        <a href="#/test">Timed</a>
        <a href="#/simulation">Full Length</a>
        <a href="#/review">Mistakes</a>
        <a href="#/spaced">Spaced</a>
        <a href="#/bank">Bank</a>
        <a href="#/analytics">Analytics</a>
        <a href="#/editor">Editor</a>
        <a href="#/ingestion">Ingestion</a>
      </nav>
      <div class="top-actions">
        <button id="themeToggle" class="icon-button" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
        <button id="backupButton" class="ghost-button" type="button">Backup</button>
      </div>
    </header>

    <main id="app" class="app-shell" tabindex="-1" aria-live="polite"></main>

    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <dialog id="modal" class="modal">
      <button class="modal-close" type="button" aria-label="Close dialog">×</button>
      <div id="modalContent"></div>
    </dialog>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
